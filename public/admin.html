<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者画面</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>管理者画面</h1>

    <section>
        <h2>スタッフ管理</h2>
        <div id="staff-list">
            <!-- Staff will be populated by JS -->
        </div>
    </section>

    <section>
        <h2>シフト種別管理</h2>
        <div id="shift-type-list">
            <!-- Shift types will be populated by JS -->
        </div>
    </section>

    <section>
        <h2>シフト希望一覧</h2>
        <div id="shift-request-list">
            <!-- Shift requests will be populated by JS -->
        </div>
    </section>

    <section>
        <h2>シフト表</h2>
        <button id="generate-schedule">シフト自動生成</button>
        <div id="compliance-warnings">
            <!-- Compliance warnings will be populated by JS -->
        </div>
        <div id="schedule-calendar">
            <!-- Calendar will be populated by JS -->
        </div>
    </section>

    <section>
        <h2>ヘルプシフト応募状況</h2>
        <div id="application-list">
            <!-- Applications will be populated by JS -->
        </div>
    </section>

    <script src="admin.js"></script>
</body>
</html>
